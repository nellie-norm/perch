<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign In - Perch</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase SDK -->
  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    const googleProvider = new GoogleAuthProvider();

    // Make functions available globally
    window.firebaseGoogleLogin = async function() {
      try {
        await signInWithPopup(auth, googleProvider);
        // Firebase Auth state is now the source of truth - no localStorage needed
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Google login error:', error);
        alert('Login failed: ' + error.message);
      }
    };

    window.firebaseEmailSignIn = async function(email, password) {
      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Firebase Auth state is now the source of truth - no localStorage needed
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Email login error:', error);
        if (error.code === 'auth/user-not-found') {
          alert('No account found with this email. Please sign up first.');
        } else if (error.code === 'auth/wrong-password') {
          alert('Incorrect password. Please try again.');
        } else {
          alert('Login failed: ' + error.message);
        }
      }
    };

    window.firebaseEmailSignUp = async function(name, email, password) {
      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);
        // Set the display name in Firebase Auth profile
        await updateProfile(result.user, { displayName: name });
        // Firebase Auth state is now the source of truth - no localStorage needed
        window.location.href = 'account.html';
      } catch (error) {
        console.error('Sign up error:', error);
        if (error.code === 'auth/email-already-in-use') {
          alert('An account with this email already exists. Please sign in.');
        } else if (error.code === 'auth/weak-password') {
          alert('Password should be at least 6 characters.');
        } else {
          alert('Sign up failed: ' + error.message);
        }
      }
    };
  </script>
  <style>
    .login-page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(180deg, #E8F0ED 0%, var(--bg) 50%);
    }

    .login-header {
      text-align: center;
      padding-top: 48px;
      margin-bottom: 32px;
    }

    .login-logo {
      margin-bottom: 24px;
    }

    .login-logo svg {
      width: 72px;
      height: 72px;
    }

    .login-title {
      font-size: 28px;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .login-card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 24px;
    }

    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
    }

    .social-btn.google {
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .social-btn.google:hover {
      background: #f8f8f8;
      border-color: #dadada;
    }

    .social-btn.apple {
      background: #000;
      color: white;
    }

    .social-btn.apple:hover {
      background: #1a1a1a;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text {
      font-size: 13px;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 16px;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .checkbox-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .forgot-link {
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: var(--primary-dark);
    }

    .signup-prompt {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .signup-prompt a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-prompt a:hover {
      text-decoration: underline;
    }

    .terms-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      margin-top: 24px;
      line-height: 1.6;
    }

    .terms-text a {
      color: var(--text-secondary);
    }

    .guest-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .guest-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .guest-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(45, 90, 74, 0.05);
    }

    .guest-btn svg {
      width: 18px;
      height: 18px;
    }

    .guest-info {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 10px;
    }

    .tab-switcher {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--card);
      color: var(--primary);
      box-shadow: var(--shadow);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Responsive */
    @media (min-width: 768px) {
      .login-page {
        justify-content: center;
        padding: 48px 32px;
      }

      .login-header {
        padding-top: 0;
      }

      .login-card {
        max-width: 420px;
        margin: 0 auto 24px;
        padding: 36px 32px;
      }

      .login-title {
        font-size: 32px;
      }

      .terms-text {
        max-width: 420px;
        margin: 24px auto 0;
      }
    }
  </style>
</head>
<body>
  <div class="page login-page">
    <header class="login-header animate-in">
      <div class="login-logo">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="16" fill="#2D5A4A"/>
          <!-- Bird body -->
          <ellipse cx="30" cy="28" rx="10" ry="8" fill="white"/>
          <!-- Bird head -->
          <circle cx="38" cy="24" r="6" fill="white"/>
          <!-- Beak -->
          <path d="M44 24L48 23L44 26Z" fill="#F4A261"/>
          <!-- Eye -->
          <circle cx="40" cy="23" r="1.5" fill="#2D5A4A"/>
          <!-- Wing detail -->
          <path d="M24 26C24 26 28 30 32 28" stroke="#2D5A4A" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Tail -->
          <path d="M20 28L14 24L14 32Z" fill="white"/>
          <!-- Perch/branch -->
          <path d="M12 42H52" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <!-- Bird legs -->
          <path d="M28 36V42M34 36V42" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="login-title">Welcome to Perch</h1>
      <p class="login-subtitle">Find your perfect workspace</p>
    </header>

    <div class="login-card animate-in">
      <div class="tab-switcher">
        <button class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Sign In Tab -->
      <div class="tab-content active" id="signin-tab">
        <div class="social-buttons">
          <button class="social-btn google" onclick="socialLogin('google')">
            <svg viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
          </button>
          <button class="social-btn apple" onclick="socialLogin('apple')">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
            Continue with Apple
          </button>
        </div>

        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">or</span>
          <div class="divider-line"></div>
        </div>

        <form onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
          </div>
          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" checked>
              Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="login-btn">Sign In</button>
        </form>
      </div>

      <!-- Sign Up Tab -->
      <div class="tab-content" id="signup-tab">
        <div class="social-buttons">
          <button class="social-btn google" onclick="socialLogin('google')">
            <svg viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign up with Google
          </button>
          <button class="social-btn apple" onclick="socialLogin('apple')">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
            Sign up with Apple
          </button>
        </div>

        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">or</span>
          <div class="divider-line"></div>
        </div>

        <form onsubmit="handleSignUp(event)">
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" class="form-input" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" class="form-input" placeholder="Create a password" required>
          </div>
          <button type="submit" class="login-btn">Create Account</button>
        </form>
      </div>
      <div class="guest-section">
        <button class="guest-btn" onclick="continueAsGuest()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Continue as Guest
        </button>
        <p class="guest-info">You can create an account later to save your favourites</p>
      </div>
    </div>

    <p class="terms-text animate-in">
      By continuing, you agree to Perch's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
    </p>
  </div>

  <script>
    function switchTab(tab) {
      // Update buttons
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Update content
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(tab + '-tab').classList.add('active');
    }

    function socialLogin(provider) {
      if (provider === 'google') {
        // Use Firebase Google login
        if (window.firebaseGoogleLogin) {
          window.firebaseGoogleLogin();
        } else {
          // Firebase not loaded yet, wait a moment
          setTimeout(() => window.firebaseGoogleLogin(), 500);
        }
      } else if (provider === 'apple') {
        // Apple Sign-In would need separate setup
        alert('Apple Sign-In coming soon! Please use Google or email for now.');
      }
    }

    function handleSignIn(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (window.firebaseEmailSignIn) {
        window.firebaseEmailSignIn(email, password);
      } else {
        setTimeout(() => window.firebaseEmailSignIn(email, password), 500);
      }
    }

    function handleSignUp(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      if (window.firebaseEmailSignUp) {
        window.firebaseEmailSignUp(name, email, password);
      } else {
        setTimeout(() => window.firebaseEmailSignUp(name, email, password), 500);
      }
    }

    function continueAsGuest() {
      // No auth state = guest. Just redirect.
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
